name: GC Hangout Quality

on:
  pull_request:
  push:
    branches: [main, gc-quality-hardening, gc-mobile-ux-hardening]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high || true
      - run: npm run build
